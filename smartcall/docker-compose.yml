services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartcall
      POSTGRES_USER: smartcall
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcall"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Leave empty to configure the database via the install wizard,
      # or set it here to skip that step:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=smartcall;Username=smartcall;Password=${DB_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET in .env}
      SMARTCALL_DATA_KEY: ${DATA_KEY:?set DATA_KEY in .env}
      Storage__RootPath: /app/storage
      Cors__AllowedOrigins: ${PUBLIC_URL:-http://localhost}
    volumes:
      - recordings:/app/storage
      - install-state:/app/state

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

  # Self-hosted TURN server for WebRTC through NAT/firewalls.
  # Set the STUN/TURN JSON in the admin panel to point at this server.
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command: >
      -n
      --listening-port=3478
      --realm=${TURN_REALM:-smartcall}
      --user=${TURN_USER:-smartcall}:${TURN_PASSWORD:-changeme}
      --lt-cred-mech
      --fingerprint
      --no-multicast-peers

volumes:
  db-data:
  recordings:
  install-state:
